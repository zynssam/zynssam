<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
<style>
.d{font:400 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e2d6b8}
.nm{font:800 40px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:url(#gt)}
.ev{font:600 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#fbbf24;letter-spacing:2px}
.bt{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1a1206;letter-spacing:1.5px;text-anchor:middle}
.tag{fill:#2a1f08;stroke:#6b5114}
.tt{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#fcd34d;text-anchor:middle}
.sh{animation:sh 4s ease-in-out infinite;animation-delay:1.2s}
@keyframes sh{0%{transform:translateX(-700px)}55%,100%{transform:translateX(700px)}}
.edge{fill:none;stroke:url(#eg);stroke-width:3;stroke-dasharray:420 1400;animation:run 5s linear infinite;animation-delay:1.2s}
@keyframes run{to{stroke-dashoffset:-1820}}
.tro{transform-origin:540px 64px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}
.glow{animation:gl 2.6s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.25}50%{opacity:.6}}
.spark{fill:#fde68a;animation:sp 2.2s ease-in-out infinite}
@keyframes sp{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1407"/><stop offset="1" stop-color="#2b1d06"/></linearGradient>
<linearGradient id="gt" x1="0" x2="1"><stop offset="0" stop-color="#fff7d6"/><stop offset=".6" stop-color="#fcd34d"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<linearGradient id="eg" x1="0" x2="1"><stop offset="0" stop-color="#f59e0b" stop-opacity="0"/><stop offset=".5" stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/></linearGradient>
<linearGradient id="shg" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fde68a" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<radialGradient id="tg"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="600" height="320" rx="18"/></clipPath>
</defs>
<g clip-path="url(#c)">
<rect width="600" height="320" fill="url(#bg)"/>
<g class="sh"><rect x="-200" y="-50" width="160" height="420" fill="url(#shg)" transform="skewX(-20)"/></g>
</g>
<rect x="1.5" y="1.5" width="597" height="317" rx="17" fill="none" stroke="#6b5114" stroke-width="1.5"/>
<rect x="1.5" y="1.5" width="597" height="317" rx="17" class="edge"/>
<rect x="36" y="32" width="190" height="26" rx="13" fill="#fbbf24"/><text x="131" y="49.5" class="bt">★ HACKATHON WINNER</text>
<text x="36" y="88" class="ev">HACKFEST SVIT 2026 · AI NEXUS</text>
<text x="36" y="138" class="nm">Nishaan</text>
<circle cx="540" cy="66" r="44" fill="url(#tg)" class="glow"/>
<g class="tro" fill="none" stroke="#fcd34d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<path d="M522 42 h36 v14 a18 18 0 0 1 -36 0z" fill="#fbbf24" fill-opacity=".25"/>
<path d="M522 46 h-9 a9 9 0 0 0 9 14"/><path d="M558 46 h9 a9 9 0 0 1 -9 14"/>
<path d="M540 74 v10"/><path d="M528 92 h24 l-3 -8 h-18z" fill="#fbbf24" fill-opacity=".25"/></g>
<circle cx="500" cy="40" r="3" class="spark" style="transform-origin:500px 40px"/>
<circle cx="580" cy="96" r="2.5" class="spark" style="transform-origin:580px 96px;animation-delay:.8s"/>
<circle cx="575" cy="30" r="2" class="spark" style="transform-origin:575px 30px;animation-delay:1.4s"/>
<text x="36" y="176" class="d">AI suspect-sketch &amp; crime-scene generator. A witness's</text><text x="36" y="201" class="d">spoken account in Hindi, Kannada or English becomes</text><text x="36" y="226" class="d">a refinable sketch plus a 3D scene layout.</text><rect x="36" y="262" width="79" height="26" rx="13" class="tag"/><text x="76" y="279.5" class="tt">FastAPI</text><rect x="123" y="262" width="63" height="26" rx="13" class="tag"/><text x="155" y="279.5" class="tt">React</text><rect x="194" y="262" width="71" height="26" rx="13" class="tag"/><text x="230" y="279.5" class="tt">Gemini</text><rect x="274" y="262" width="55" height="26" rx="13" class="tag"/><text x="301" y="279.5" class="tt">Groq</text>
</svg>